name: dting
description: "A new Flutter project."

publish_to: "none"

version: 1.2.1+5

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  intl: any
  get: ^4.7.2
  dio: ^5.8.0+1
  http: ^1.3.0
  hive: ^2.2.3
  path_provider: ^2.1.3
  sqflite: ^2.4.2
  just_audio: ^0.10.4
  flutter_blue_plus: ^1.35.5
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.0

  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.15
  args: ^2.4.2
  process_run: ^0.13.0+1
flutter_launcher_icons:
  android: true
  ios: true
  # image_path: "assets/images_v3/desktop-icons.png"  # 替换为你的图标路径 
  # image_path: "assets/images_v3/desktop.png"  # 替换为你的图标路径 
  image_path: "assets/images_v3/desktop1.png"  # 替换为你的图标路径 

  remove_alpha_ios: true  # 👈 添加这个字段。 
  
flutter_native_splash:
  image: assets/images/starup/splash_bg_cn.png # 背景图片（建议为透明 PNG）  
  color: "#ffffff"   # ✅ 添加背景颜色

  # 适配不同尺寸
  android: true
  ios: true

  # 自定义图片尺寸
  android_gravity: fill # 背景图片拉伸填满
  ios_content_mode: scaleToFill
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/assets/
    - assets/images_v3/ 
    - assets/images/
    - assets/images/sign/
    - assets/images/vip/
    - assets/images/starup/
    - assets/images/homeindex/
    - assets/images/device/
    - assets/images/personal/
    - assets/svg/
    - assets/svg/sign/
    - assets/svg/homeindex/
    - assets/svg/device/
    - assets/svg/sidebar/
    - assets/svg/personal/
    - assets/default_payment_profile_apple_pay.json
    - assets/lotties/
    - assets/firmware/

  fonts:
    - family: PingFang SC
      fonts:
        - asset: assets/fonts/PingFangSC/PingFangSC-UltraLight.otf
          weight: 100
        - asset: assets/fonts/PingFangSC/PingFangSC-Thin.otf
          weight: 200
        - asset: assets/fonts/PingFangSC/PingFangSC-Light.otf
          weight: 300
        - asset: assets/fonts/PingFangSC/PingFangSC-Regular.otf
          weight: 400
        - asset: assets/fonts/PingFangSC/PingFangSC-Medium.otf
          weight: 500
        - asset: assets/fonts/PingFangSC/PingFangSC-SemiBold.otf
          weight: 700
    - family: Fugaz One
      fonts:
        - asset: assets/fonts/Fugaz One.ttf
